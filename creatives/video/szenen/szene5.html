<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* Szene 5 (4 s): Abbinder – Wortmarke, Claim, Demo-Disclaimer */
  html, body { background: var(--ink); color: #fff; }
  .marke {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transform: scale(.9);
    animation: marke-in .5s cubic-bezier(.2,1.3,.4,1) .3s forwards;
  }
  .marke .wort { font-size: 58px; font-weight: 900; letter-spacing: -0.04em; }
  .marke .punkt {
    width: 16px; height: 16px; border-radius: 999px;
    background: var(--green);
    margin-top: 22px;
  }
  @keyframes marke-in { to { opacity: 1; transform: scale(1); } }
  .claim {
    margin-top: 22px;
    font-size: 30px;
    font-weight: 700;
    color: #C9CCC9;
    text-align: center;
    text-wrap: balance;
    opacity: 0;
    animation: caption-in .5s ease 1.1s forwards;
  }
  .claim strong { color: #fff; font-weight: 900; }
  .demo-pill {
    margin-top: 34px;
    opacity: 0;
    animation: caption-in .5s ease 1.7s forwards;
  }
  .demo-pill .pill { background: rgba(255,255,255,.08); color: #7CE0B3; }
  .disclaimer {
    position: absolute;
    left: 40px; right: 40px; bottom: 60px;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    color: #8A8F8A;
    opacity: 0;
    animation: caption-in .5s ease 2s forwards;
  }
</style>
</head>
<body>
  <div class="buehne">
    <div class="marke">
      <span class="wort">getsafe</span>
      <span class="punkt"></span>
    </div>
    <p class="claim"><strong>Kassen-Check.</strong> Hol dir dein Geld zurück.</p>
    <div class="demo-pill">
      <span class="pill"><span class="punkt" style="background:#12B76A"></span> Sparpotenzial in 10 Sekunden</span>
    </div>
    <p class="disclaimer">
      Konzept-Demo · Bewerbungsarbeit Norbert Sommer ·
      keine Werbung und keine Produktion der Getsafe GmbH
    </p>
  </div>
</body>
</html>
