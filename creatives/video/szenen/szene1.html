<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* Szene 1 (3 s): Gehaltsabrechnung – der KV-Abzug sticht heraus.
     Fachlich korrekt: Angestellte zahlen die GKV nicht per Konto-Abbuchung,
     der Arbeitgeber behaelt den Beitrag direkt vom Brutto ein. */
  .abrechnung {
    width: 100%;
    max-width: 430px;
    border-radius: 28px;
    border: 1px solid var(--line);
    background: var(--paper);
    box-shadow: 0 20px 60px rgba(17,18,16,.08);
    padding: 26px;
  }
  .kopf {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .kopf .titel { font-size: 21px; font-weight: 900; }
  .kopf .monat { font-size: 14px; color: var(--ink-soft); font-weight: 600; }
  .brutto {
    display: flex;
    justify-content: space-between;
    padding: 13px 12px;
    font-size: 16px;
    font-weight: 800;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .zeile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 12px;
    border-radius: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: zeile-in .35s ease forwards;
  }
  .zeile:nth-of-type(2) { animation-delay: .15s; }
  .zeile:nth-of-type(3) { animation-delay: .35s; }
  .zeile:nth-of-type(4) { animation-delay: .55s; }
  @keyframes zeile-in { to { opacity: 1; transform: translateY(0); } }
  .zeile .name { font-size: 16px; font-weight: 600; }
  .zeile .sub { font-size: 13px; color: var(--ink-soft); font-weight: 400; margin-top: 2px; }
  .zeile .betrag { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kv {
    animation: zeile-in .35s ease .55s forwards, hervor .5s ease 1.35s forwards;
  }
  @keyframes hervor {
    to {
      background: #FDF3F2;
      box-shadow: inset 0 0 0 2px #D92D20;
    }
  }
  .kv .betrag { color: #D92D20; }
</style>
</head>
<body>
  <div class="buehne">
    <div class="abrechnung">
      <div class="kopf">
        <span class="titel">Gehaltsabrechnung</span>
        <span class="monat">Juli 2026</span>
      </div>
      <div class="brutto">
        <span>Bruttogehalt</span>
        <span>3.500,00&thinsp;€</span>
      </div>
      <div class="zeile">
        <span><span class="name">Lohnsteuer</span></span>
        <span class="betrag">−409,75&thinsp;€</span>
      </div>
      <div class="zeile">
        <span><span class="name">Rentenversicherung</span></span>
        <span class="betrag">−325,50&thinsp;€</span>
      </div>
      <div class="zeile kv">
        <span>
          <span class="name">Krankenversicherung</span>
          <div class="sub">dein Anteil · Zusatzbeitrag 4,39&thinsp;%</div>
        </span>
        <span class="betrag">−332,33&thinsp;€</span>
      </div>
    </div>
    <p class="caption" style="animation-delay: 1.7s">
      Dieser Abzug ist bei dir <span class="gruen">zu hoch</span>. Vermutlich.
    </p>
  </div>
</body>
</html>
